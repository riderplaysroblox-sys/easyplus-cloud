<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EASyPLUS Cloud Overlay</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;overflow:hidden}body{font-family:"Courier New",Courier,monospace;text-transform:uppercase}.frame{width:100vw;height:100vh;aspect-ratio:16/9;background:#000;position:relative;display:flex;align-items:center;justify-content:center}.content{width:84%;height:82%;display:flex;flex-direction:column;align-items:center;text-align:center;font-size:clamp(14px,1.7vw,34px);line-height:1.35}.heading{font-weight:bold;margin:1.8% 0 5%;white-space:pre-wrap}.same{font-size:.78em;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.message{margin:6% 0;max-width:100%;white-space:pre-wrap;animation:scroll 18s linear infinite;line-height:1.5}.idle{margin:auto;white-space:pre-wrap}@keyframes scroll{0%{transform:translateY(35%)}100%{transform:translateY(-35%)}}@media(min-aspect-ratio:16/9){.content{height:82%;width:84%}}@media(max-aspect-ratio:16/9){.content{width:92%;height:90%;font-size:clamp(12px,2.5vw,26px)}}.hidden{display:none}</style></head><body><div class="frame"><div class="content" id="content"><div class="idle">NO ACTIVE ALERT</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const q=new URLSearchParams(location.search);let db=null,activeAudio=null,seen=0;
function build(a){const el=document.getElementById('content');el.innerHTML='';const h=document.createElement('div');h.className='heading';h.textContent=(a.title||'EMERGENCY ALERT SYSTEM').toUpperCase();const s=document.createElement('div');s.className='same';const locations=(a.locations||'000000').replace(/\\s/g,'').split(',').join('-');s.textContent=`ZCZC-${a.originator||'WXR'}-${a.eventCode||'RWT'}-${locations}-P-0000000-${String(a.duration||15).padStart(4,'0')}+0000-0000-EAS-`;const m=document.createElement('div');m.className='message';m.textContent=(a.message||'').toUpperCase();el.append(h,s,m,s.cloneNode(true))}
function render(state){if(state.mode==='playing'&&state.alert){build(state.alert);if(state.updatedAt!==seen){seen=state.updatedAt;const audioUrl=q.get('audio');if(audioUrl){try{activeAudio?.pause();activeAudio=new Audio(audioUrl);activeAudio.play().catch(()=>{})}catch{}}}}else{document.getElementById('content').innerHTML='<div class="idle">NO ACTIVE ALERT</div>';if(activeAudio){activeAudio.pause();activeAudio=null}}}
async function connect(){const url=q.get('url'),key=q.get('key');if(!url||!key){document.getElementById('content').innerHTML='<div class="idle">NO ACTIVE ALERT</div>';return}try{db=window.supabase.createClient(url,key);const {data}=await db.from('overlay_state').select('*').eq('id',1).maybeSingle();if(data)render({mode:data.mode,alert:data.alert,updatedAt:Date.parse(data.updated_at)||Date.now()});db.channel('overlay-live').on('postgres_changes',{event:'*',schema:'public',table:'overlay_state'},p=>{if(p.new)render({mode:p.new.mode,alert:p.new.alert,updatedAt:Date.parse(p.new.updated_at)||Date.now()})}).subscribe()}catch(e){console.error(e)}}connect();
</script></body></html>
